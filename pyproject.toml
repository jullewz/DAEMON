[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daemonkit"
version = "6.6.6"
description = "The dev & IT toolkit from hell - zero dependencies, Linux and Windows"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "jullewz" }]

[project.scripts]
dmn = "daemon:main"

[tool.setuptools]
py-modules = ["daemon"]
